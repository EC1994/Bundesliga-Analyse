<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><title>Bundesliga Hub</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--nav:#0b1220;--accent:#e11d48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:84px}.top{background:var(--nav);color:#fff;padding-top:env(safe-area-inset-top)}.wrap{max-width:900px;margin:auto;padding:0 15px}.header{height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:19px}.brand span{color:#fb7185}.search{width:145px;background:#182235;color:#fff;border:1px solid #344054;border-radius:10px;padding:8px}.page{padding:18px 0}.view{display:none}.view.active{display:block}.hero h1{font-size:29px;margin:0}.hero p{color:var(--muted);margin:5px 0 15px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.filters button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px}.filters button.active{background:#111827;color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:3px}.badge{font-size:10px;font-weight:900;padding:4px 7px;border-radius:99px;white-space:nowrap}.green{background:#dcfce7;color:#166534}.blue{background:#dbeafe;color:#1d4ed8}.red{background:#fee2e2;color:#991b1b}.yellow{background:#fef3c7;color:#92400e}.clubgrid,.playergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.club,.player{border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;text-align:left}.crest{height:46px;width:46px;background:#eef2f6;border-radius:11px;display:grid;place-items:center;font-weight:900}.club b,.player b{display:block;margin-top:7px}.muted{font-size:12px;color:var(--muted)}.player img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#eef2f6}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px #10182812}.bottom button{border:0;background:none;color:#667085;font-size:10px;padding:4px 0}.bottom button.active{color:#e11d48;font-weight:900}.ico{display:block;font-size:21px;line-height:23px}.modal{display:none;position:fixed;inset:0;background:#0f172a99;z-index:40;align-items:flex-end;padding:0}.modal.open{display:flex}.modalbox{width:100%;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}.close{float:right;border:0;background:#f2f4f7;border-radius:8px;width:34px;height:34px}.pitch{background:#e5f2e8;border:1px solid #bfd3c2;border-radius:14px;padding:14px}.pitchgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chip{background:#fff;border:1px solid #d5e0d8;border-radius:8px;padding:8px;text-align:center;font-size:11px}.comments{border-top:1px solid var(--line);margin-top:17px;padding-top:12px}.comment{padding:10px 0;border-bottom:1px solid var(--line)}.vote button,.replybtn{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 9px;margin-right:5px}.commentbox,.replybox{display:flex;gap:7px;margin-top:8px}.commentbox input,.replybox input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px}.commentbox button,.replybox button{border:0;background:#111827;color:#fff;border-radius:9px;padding:9px 12px}
</style></head><body>
<header class=top><div class="wrap header"><div class=brand>BUNDESLIGA <span>HUB</span></div><input id=search class=search placeholder="Suchen…"></div></header>
<main class="wrap page">
<section id=news class="view active"><div class=hero><h1>News</h1><p>News, Transfers und Verletzungen zusammengeführt.</p></div><div class=filters><button class=active onclick="filterNews('all',this)">Alle</button><button onclick="filterNews('news',this)">News</button><button onclick="filterNews('transfer',this)">Transfers</button><button onclick="filterNews('injury',this)">Verletzungen</button></div><div id=newsList></div></section>
<section id=live class=view><div class=hero><h1>Live</h1><p>Live-Spielstände und Ereignisse.</p></div><div class=card id=liveList></div></section>
<section id=transfers class=view><div class=hero><h1>Transfers</h1><p>Bestätigte Bewegungen und Gerüchte.</p></div><div class=card id=transferList></div></section>
<section id=table class=view><div class=hero><h1>Tabelle</h1></div><div class=card id=tableList></div></section>
<section id=clubs class=view><div class=hero><h1>Vereine</h1><p>Voraussichtliche S11 + kompletter Kader.</p></div><div class=card><div id=clubGrid class=clubgrid></div></div></section>
</main>
<nav class=bottom><button class=active onclick="show('news',this)"><span class=ico>📰</span>News</button><button onclick="show('live',this)"><span class=ico>⚽</span>Live</button><button onclick="show('transfers',this)"><span class=ico>🔄</span>Transfers</button><button onclick="show('table',this)"><span class=ico>📊</span>Tabelle</button><button onclick="show('clubs',this)"><span class=ico>👥</span>Vereine</button></nav>
<div id=modal class=modal><div class=modalbox><button class=close onclick=closeModal()>×</button><div id=modalBody></div></div></div>
<script>
const esc=x=>String(x??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const voter=localStorage.voter||(localStorage.voter="v-"+crypto.randomUUID());
async function api(u){return(await fetch(u)).json()}
function show(id,b){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));document.querySelectorAll(".bottom button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");if(id==="live")live();if(id==="transfers")transfers();if(id==="table")table();if(id==="clubs")clubs()}
let news=[{type:"news",title:"Bundesliga News",source:"Bundesliga Hub",time:"Heute"},{type:"transfer",title:"Transfer-Radar",source:"Transfers",time:"Heute"},{type:"injury",title:"Verletzungs-Check",source:"Verletzungen",time:"Heute"}];
function renderNews(f="all"){document.getElementById("newsList").innerHTML=news.filter(x=>f==="all"||x.type===f).map((x,i)=>`<article class=card><span class="badge ${x.type==="transfer"?"blue":x.type==="injury"?"red":"green"}>${x.type==="transfer"?"TRANSFER":x.type==="injury"?"VERLETZUNG":"NEWS"}</span><h3>${esc(x.title)}</h3><small>${esc(x.source)} · ${esc(x.time)}</small>${community("news-"+i)}</article>`).join("")}
function filterNews(f,b){document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderNews(f)}
async function loadNews(){try{let d=await api("/api/news");if(d.items?.length)news=d.items.map(x=>({type:x.category||"news",title:x.title,source:x.source||"Quelle",time:x.published_at||""}))}catch(e){}renderNews()}
async function live(){let d=await api("/api/live");document.getElementById("liveList").innerHTML=d.ok?(d.data||[]).map(x=>`<div class=row><div><b>${esc(x.teams.home.name)} – ${esc(x.teams.away.name)}</b><small>${x.fixture.status.elapsed||0}'</small></div><strong>${x.goals.home} : ${x.goals.away}</strong></div>`).join("")||"<p class=muted>Aktuell kein Live-Spiel.</p>":`<p class=muted>${esc(d.message)}</p>`}
async function transfers(){let d=await api("/api/transfers");document.getElementById("transferList").innerHTML=(d.data||[]).slice(0,80).map(x=>`<div class=row><div><b>${esc(x.player?.name)}</b><small>${esc(x.transfers?.[0]?.teams?.out?.name||"")} → ${esc(x.transfers?.[0]?.teams?.in?.name||"")}</small></div><span class="badge blue">Transfer</span></div>`).join("")||`<p class=muted>${esc(d.message||"Keine Daten.")}</p>`}
async function table(){let d=await api("/api/table"),a=d.data?.[0]?.league?.standings?.[0]||d.data||[];document.getElementById("tableList").innerHTML=`<table style="width:100%;border-collapse:collapse"><tr><th>#</th><th>Verein</th><th>Sp</th><th>TD</th><th>Pkt</th></tr>${a.map((x,i)=>`<tr><td>${x.rank||i+1}</td><td>${esc(x.team?.name||x.teamName)}</td><td>${x.all?.played??x.matches??0}</td><td>${x.goalsDiff??0}</td><td><b>${x.points??0}</b></td></tr>`).join("")}</table>`}
async function clubs(){let a=await api("/api/clubs");document.getElementById("clubGrid").innerHTML=a.map((c,i)=>`<button class=club onclick="club(${i})"><div class=crest>${c.slice(0,3).toUpperCase()}</div><b>${esc(c)}</b><span class=muted>S11 · Kader · Spieler</span></button>`).join("")}
async function club(i){let a=await api("/api/clubs"),c=a[i],d=await api("/api/team/"+encodeURIComponent(c)),p=d.players||[];document.getElementById("modalBody").innerHTML=`<h2>${esc(d.team?.name||c)}</h2>${d.team?.logo?`<img src="${esc(d.team.logo)}" style="width:64px;height:64px;object-fit:contain">`:""}<h3>Voraussichtliche S11</h3><div class=pitch>${d.lineup?xi(d.lineup):"<p class=muted>Die S11 wird automatisch angezeigt, sobald die Datenquelle eine nächste Aufstellung liefert.</p>"}</div><h3>Spieler (${p.length})</h3><div class=playergrid>${p.map(x=>`<div class=player><img src="${esc(x.photo||"")}" onerror="this.style.visibility='hidden'"><b>${esc(x.name)}</b><span class=muted>${esc(x.position||"")} ${x.number?"· #"+x.number:""}</span></div>`).join("")}</div>${!p.length?`<p class=muted>${esc(d.message||"Kaderdaten nicht verfügbar.")}</p>`:""}${community("club-"+i)}`;document.getElementById("modal").classList.add("open");renderComments("club-"+i)}
function xi(x){let a=x.startXI||[];return `<div class=pitchgrid>${a.map(y=>`<div class=chip>${esc(y.player?.name||"")}</div>`).join("")}</div>`}
function community(k){return `<div class=comments><h3>Community</h3><div id=c-${k}></div><div class=commentbox><input id=i-${k} placeholder="Kommentar schreiben…"><button onclick="comment('${k}')">Posten</button></div></div>`}
async function renderComments(k){let a=await api("/api/comments?post="+encodeURIComponent(k)),e=document.getElementById("c-"+k);if(!e)return;e.innerHTML=a.map(c=>`<div class=comment><b>${esc(c.user_name)}</b><p>${esc(c.text)}</p><button onclick="vote(${c.id},'${k}',1)">👍 ${c.up}</button><button onclick="vote(${c.id},'${k}',-1)">👎 ${c.down}</button></div>`).join("")}
async function comment(k){let i=document.getElementById("i-"+k),v=i.value.trim();if(!v)return;await fetch("/api/comments",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({postKey:k,userName:"Du",text:v})});i.value="";renderComments(k)}
async function vote(id,k,v){await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({commentId:id,voterKey:voter,value:v})});renderComments(k)}
function closeModal(){document.getElementById("modal").classList.remove("open")}
loadNews();clubs();setInterval(loadNews,60000);setInterval(()=>document.getElementById("live").classList.contains("active")&&live(),20000);
</script></body></html>
